<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1A2129;--paper:#DEDDD3;--sheet:#E9E8E0;--rule:#A9A79A;
        --red:#A82C31;--blue:#1D4E77;--go:#2F6B4F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:clamp(0px,2.5vw,32px)}
  .sheet{max-width:1180px;margin:0 auto;background:var(--sheet);
    border:1.5px solid var(--ink);box-shadow:6px 6px 0 rgba(26,33,41,.14)}
  @media(max-width:620px){.sheet{border-left:none;border-right:none;box-shadow:none}}

  .bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    padding:16px clamp(14px,3vw,28px);border-bottom:1.5px solid var(--ink)}
  h1{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:.04em;font-size:clamp(22px,4vw,34px);line-height:1;margin:0}
  .clock{font-family:"IBM Plex Mono",monospace;font-size:clamp(26px,5vw,40px);
    font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto;letter-spacing:-.02em}
  .clock.warn{color:var(--red)}
  .onclock{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.14em;font-size:12px;color:var(--blue)}
  .onclock b{display:block;font-size:21px;letter-spacing:.05em;color:var(--ink)}
  .you{background:var(--go);color:var(--sheet);padding:2px 8px;display:inline-block;
    font-family:"Barlow Condensed",sans-serif;letter-spacing:.14em;font-size:11px;
    text-transform:uppercase;margin-top:3px}

  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:0}
  @media(max-width:840px){.grid{grid-template-columns:1fr}}
  .pane{padding:14px clamp(14px,3vw,24px)}
  .pane+.pane{border-left:1px solid var(--rule)}
  @media(max-width:840px){.pane+.pane{border-left:none;border-top:1px solid var(--rule)}}
  h2{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.2em;font-size:11px;color:var(--blue);margin:0 0 9px;font-weight:600}

  .filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  .chip{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.09em;font-size:11px;padding:4px 9px;border:1px solid var(--rule);
    background:transparent;color:#4A5560;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
  .chip.full{opacity:.35;text-decoration:line-through}
  input[type=search]{font-size:14px;padding:5px 9px;border:1px solid var(--rule);
    background:#F3F2EC;color:var(--ink);flex:1;min-width:120px}

  ul{list-style:none;margin:0;padding:0}
  .pool{max-height:56vh;overflow-y:auto;border-top:1px solid var(--rule)}
  .pool li{display:flex;align-items:center;gap:9px;padding:6px 0;
    border-bottom:1px solid var(--rule)}
  .nm{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;
    text-transform:uppercase;letter-spacing:.05em}
  .rk{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--red);
    vertical-align:super;margin-left:4px}
  .dv{font-size:10px;color:#6B7480;text-transform:uppercase;letter-spacing:.06em}
  .vp{font-family:"IBM Plex Mono",monospace;font-size:13px;margin-left:auto;
    color:var(--blue);font-weight:600}
  button.pick{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.1em;font-size:11px;font-weight:600;padding:4px 10px;
    border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);cursor:pointer}
  button.pick:hover:not([disabled]){background:var(--go);border-color:var(--go)}
  button.pick[disabled]{opacity:.25;cursor:not-allowed}

  .feed li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule);
    font-size:13px;align-items:baseline}
  .ov{font-family:"IBM Plex Mono",monospace;font-size:10px;color:#8A9099;min-width:26px}
  .auto{font-size:9px;color:var(--red);text-transform:uppercase;letter-spacing:.1em}
  .slots{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px}
  .slots span{font-family:"IBM Plex Mono",monospace;font-size:11px;
    border:1px solid var(--rule);padding:2px 6px;background:#F3F2EC}
  .slots span.done{opacity:.35}
  .alert{border-left:3px solid var(--red);background:rgba(168,44,49,.08);
    padding:8px 12px;margin:0 0 10px;font-size:13px}
  .cta{padding:14px clamp(14px,3vw,28px);border-top:1px solid var(--rule)}
  .cta button{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.12em;font-size:13px;font-weight:600;padding:9px 18px;
    border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);cursor:pointer}
  .muted{color:#6B7480;font-size:13px;font-style:italic}
</style>
</head>
<body>
<main class="sheet">
  <div class="bar">
    <div>
      <h1 id="title">Draft Room</h1>
      <div class="onclock" id="status">connecting…</div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div id="alert"></div>
  <div class="grid">
    <div class="pane">
      <h2>Available</h2>
      <div class="filters" id="filters">
        <input type="search" id="q" placeholder="Search" aria-label="Search fighters">
      </div>
      <ul class="pool" id="pool"></ul>
    </div>
    <div class="pane">
      <h2>Your slots</h2>
      <div class="slots" id="slots"></div>
      <h2>Recent picks</h2>
      <ul class="feed" id="feed"></ul>
    </div>
  </div>
  <div class="cta" id="cta"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state = null, division = "", query = "", pool = [], busy = false, deadline = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: body ? {"content-type":"application/json"} : {},
    body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function warn(msg) {
  $("#alert").innerHTML = msg ? `<div class="alert">${esc(msg)}</div>` : "";
}

async function refresh() {
  try {
    state = await api("GET", "/api/draft/state");
    deadline = state.draft?.deadline_at ? new Date(state.draft.deadline_at) : null;
    render();
    await loadPool();
  } catch (e) { warn(e.message); }
}

async function loadPool() {
  if (!state?.draft || state.draft.complete) { pool = []; renderPool(); return; }
  const p = new URLSearchParams({ available: "1", limit: "60" });
  if (division) p.set("division", division);
  if (query) p.set("q", query);
  try {
    const d = await api("GET", "/api/fighters?" + p);
    pool = d.fighters;
    renderPool();
  } catch (e) { warn(e.message); }
}

function render() {
  const d = state.draft, me = state.me;
  if (!d) { $("#status").textContent = "No draft scheduled"; return; }
  $("#title").textContent = state.league.name;

  if (d.complete) {
    $("#status").innerHTML = "<b>Draft complete</b>";
    $("#clock").textContent = "--:--";
  } else if (d.status !== "live") {
    $("#status").innerHTML = `<b>Not started</b>`;
  } else {
    const team = state.teams.find(t => t.id === d.on_clock_team);
    $("#status").innerHTML =
      `Round ${d.current_round} · pick ${d.current_pick} of ${d.total_picks}` +
      `<b>${esc(team ? team.name : "?")}</b>` +
      (me?.on_clock ? '<span class="you">You are on the clock</span>' : "");
  }

  // slots
  const open = me?.open_slots || {};
  const divs = state.league.divisions;
  $("#slots").innerHTML = divs.map(dv => {
    const left = open[dv] ?? 0;
    return `<span class="${left ? "" : "done"}">${esc(dv.slice(0,3).toUpperCase())} ${
      state.league.slots_per_div - left}/${state.league.slots_per_div}</span>`;
  }).join("");

  // filters
  const f = $("#filters");
  if (!f.dataset.built) {
    divs.forEach(dv => {
      const b = document.createElement("button");
      b.className = "chip"; b.dataset.div = dv;
      b.textContent = dv.replace("Light Heavyweight","L Heavy");
      b.setAttribute("aria-pressed","false");
      f.insertBefore(b, $("#q"));
    });
    const all = document.createElement("button");
    all.className = "chip"; all.dataset.div = ""; all.textContent = "All";
    all.setAttribute("aria-pressed","true");
    f.insertBefore(all, f.firstChild);
    f.addEventListener("click", e => {
      const b = e.target.closest(".chip"); if (!b) return;
      division = b.dataset.div;
      f.querySelectorAll(".chip").forEach(c =>
        c.setAttribute("aria-pressed", String(c === b)));
      loadPool();
    });
    $("#q").addEventListener("input", e => {
      query = e.target.value; clearTimeout(window._t);
      window._t = setTimeout(loadPool, 250);
    });
    f.dataset.built = "1";
  }
  f.querySelectorAll(".chip[data-div]").forEach(c => {
    if (c.dataset.div) c.classList.toggle("full", !(open[c.dataset.div] > 0));
  });

  $("#feed").innerHTML = (d.recent_picks || []).map(p =>
    `<li><span class="ov">${p.overall}</span>
      <span><b>${esc(p.fighter || "—")}</b><br>
      <span class="dv">${esc(p.team_name)} · ${esc(p.division || "")}</span></span>
      ${p.autopicked ? '<span class="auto">auto</span>' : ""}</li>`).join("")
    || '<li class="muted">No picks yet.</li>';

  const boss = state.me?.is_commissioner;
  $("#cta").innerHTML =
    (d.status === "scheduled" && boss)
      ? '<button id="start">Start draft</button>'
      : (d.complete ? '<span class="muted">Draft complete. Rosters are set.</span>' : "");
  const s = $("#start");
  if (s) s.onclick = async () => {
    try { await api("POST","/api/draft/start"); await refresh(); }
    catch (e) { warn(e.message); }
  };
}

function renderPool() {
  const me = state?.me, d = state?.draft;
  const canPick = !!(me?.on_clock && d?.status === "live" && !d.complete);
  const open = me?.open_slots || {};
  $("#pool").innerHTML = pool.map(f => {
    const blocked = !(open[f.division] > 0);
    return `<li>
      <span><span class="nm">${esc(f.display_name)}</span>${
        f.rank ? `<span class="rk">${esc(f.rank)}</span>` : ""}<br>
        <span class="dv">${esc(f.division)}${f.ufc_record ? " · " + esc(f.ufc_record) : ""}</span></span>
      <span class="vp">${f.proj_vorp ?? ""}</span>
      <button class="pick" data-id="${f.id}" ${canPick && !blocked ? "" : "disabled"}>Draft</button>
    </li>`;
  }).join("") || '<li class="muted">Nobody available matches that.</li>';

  document.querySelectorAll(".pick").forEach(b => b.onclick = () => pick(b.dataset.id));
}

async function pick(id) {
  if (busy) return;
  busy = true; warn("");
  try {
    await api("POST", "/api/draft/pick", { fighter_id: Number(id) });
    await refresh();
  } catch (e) { warn(e.message); await refresh(); }
  finally { busy = false; }
}

// Clock. When it expires, whoever is watching nudges the server, which
// re-checks the deadline itself before autopicking.
setInterval(async () => {
  if (!deadline || !state?.draft || state.draft.status !== "live" || state.draft.complete) {
    $("#clock").textContent = "--:--"; return;
  }
  const left = Math.max(0, Math.floor((deadline - new Date()) / 1000));
  const m = String(Math.floor(left / 60)).padStart(2,"0");
  const s = String(left % 60).padStart(2,"0");
  $("#clock").textContent = `${m}:${s}`;
  $("#clock").classList.toggle("warn", left <= 15);
  if (left === 0 && !busy) {
    busy = true;
    try { await api("POST","/api/draft/autopick"); } catch (e) {}
    busy = false; await refresh();
  }
}, 1000);

setInterval(() => { if (!busy) refresh(); }, 3000);
refresh();
</script>
</body>
</html>

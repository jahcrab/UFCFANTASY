<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy UFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A2129; --paper:#DEDDD3; --sheet:#E9E8E0;
    --rule:#A9A79A; --red:#A82C31; --blue:#1D4E77;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;padding:clamp(0px,3vw,44px);
  }
  .sheet{max-width:920px;margin:0 auto;background:var(--sheet);
    border:1.5px solid var(--ink);box-shadow:6px 6px 0 rgba(26,33,41,.14)}
  @media(max-width:620px){.sheet{border-left:none;border-right:none;box-shadow:none}}

  .masthead{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;
    align-items:flex-end;padding:22px clamp(16px,3vw,30px) 16px;
    border-bottom:1.5px solid var(--ink)}
  .eyebrow{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.22em;font-size:11px;color:var(--blue);margin:0 0 3px}
  h1{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:.03em;font-size:clamp(28px,5.5vw,42px);line-height:.95;margin:0}
  .who{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:#5C6670;text-align:right}
  .who b{display:block;color:var(--ink);font-weight:500}
  .badge{display:inline-block;font-family:"Barlow Condensed",sans-serif;
    text-transform:uppercase;letter-spacing:.14em;font-size:10px;
    border:1px solid var(--blue);color:var(--blue);padding:1px 6px;margin-top:4px}

  section{padding:20px clamp(16px,3vw,30px);border-bottom:1px solid var(--rule)}
  section:last-of-type{border-bottom:none}
  h2{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.2em;font-size:11px;color:var(--blue);margin:0 0 14px;font-weight:600}

  .teams{list-style:none;margin:0 0 16px;padding:0;border-top:1px solid var(--rule)}
  .teams li{display:flex;align-items:center;gap:12px;padding:9px 0;
    border-bottom:1px solid var(--rule)}
  .num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#8A9099;min-width:20px}
  .tname{font-family:"Barlow Condensed",sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.07em;font-size:18px}
  .temail{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:#6B7480;
    margin-left:auto;overflow:hidden;text-overflow:ellipsis}
  .unclaimed{color:var(--red)}

  form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  input,select{font-family:"IBM Plex Sans",sans-serif;font-size:14px;
    padding:8px 10px;border:1px solid var(--rule);background:#F3F2EC;color:var(--ink)}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  input[type=datetime-local]{font-family:"IBM Plex Mono",monospace;font-size:13px}
  button{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.12em;font-size:13px;font-weight:600;padding:9px 16px;
    border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);cursor:pointer}
  button:hover{background:var(--blue);border-color:var(--blue)}
  button.ghost{background:transparent;color:var(--ink)}
  button.ghost:hover{background:var(--ink);color:var(--sheet)}
  button.link{border:none;background:none;color:var(--red);padding:2px 4px;
    letter-spacing:.1em;font-size:11px}
  button.link:hover{background:none;text-decoration:underline}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;
    font-family:"IBM Plex Mono",monospace;font-size:13px;margin:0 0 16px}
  .kv dt{color:#6B7480}
  .kv dd{margin:0}
  .order{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
  .order li{font-family:"IBM Plex Mono",monospace;font-size:12px;
    border:1px solid var(--rule);padding:3px 8px;background:#F3F2EC}
  .order li span{color:#8A9099;margin-right:5px}

  .note{font-size:13px;color:#4A5560;margin:0}
  .alert{border-left:3px solid var(--red);background:rgba(168,44,49,.07);
    padding:10px 14px;margin:0 0 16px;font-size:13.5px}
  .empty{color:#6B7480;font-size:13.5px;font-style:italic;margin:0 0 14px}
</style>
</head>
<body>
<main class="sheet">
  <div class="masthead">
    <div>
      <p class="eyebrow" id="season">Loading</p>
      <h1 id="leagueName">—</h1>
    </div>
    <div class="who" id="who"></div>
  </div>
  <div id="app"></div>
  <section style="border-top:1.5px solid var(--ink)">
    <h2>Draft board</h2>
    <p class="note" style="margin-bottom:10px">Projected 2027 points for every fighter, ranked by value over replacement.</p>
    <a href="board.html"><button type="button">Open draft board</button></a>
    <a href="draft.html"><button type="button" class="ghost">Draft room</button></a>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let state = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "content-type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function fmtDate(s) {
  if (!s) return "not set";
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleString(undefined,
    { weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
}

async function load() {
  state = await api("GET", "/api/state");
  render();
}

function render() {
  const { league, teams, draft, me } = state;
  $("#season").textContent =
    `${league.season_year} season · ${league.divisions.length} divisions · ${league.roster_size} fighters per team`;
  $("#leagueName").textContent = league.name;
  $("#who").innerHTML = me
    ? `<b>${esc(me.display_name || me.email)}</b>${esc(me.email)}` +
      (me.is_commissioner ? '<span class="badge">Commissioner</span>' : "")
    : "<b>Not signed in</b>read only";

  const boss = !!me?.is_commissioner;
  const drafting = draft && draft.status !== "scheduled";
  let html = "";

  if (!me) {
    html += `<section><div class="alert">You are viewing this league signed out, so nothing can be changed. If Cloudflare Access were switched on, you would have been asked for a sign-in code before reaching this page.</div></section>`;
  } else if (me.pending) {
    html += `<section><div class="alert">Signed in as ${esc(me.email)}, but you are not in this league yet. Ask the commissioner to add a team with your email address.</div></section>`;
  }

  html += `<section><h2>Teams — ${teams.length}</h2>`;
  if (!teams.length) {
    html += `<p class="empty">No teams yet. ${boss ? "Add the first one below." : "The commissioner hasn't added any."}</p>`;
  } else {
    html += `<ul class="teams">` + teams.map((t, i) => `
      <li>
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
        <span class="tname">${esc(t.name)}</span>
        <span class="temail ${t.manager_id ? "" : "unclaimed"}">${
          t.manager_id ? esc(t.manager_name) : "no manager"}</span>
        ${boss && !drafting ? `<button class="link" data-remove="${t.id}">Remove</button>` : ""}
      </li>`).join("") + `</ul>`;
  }
  if (boss && !drafting) {
    html += `
      <form id="addTeam">
        <input name="name" placeholder="Team name" maxlength="40" required>
        <input name="manager_email" type="email" placeholder="Manager email (optional)">
        <button type="submit">Add team</button>
      </form>
      <p class="note" style="margin-top:8px">The email is how that person signs in. It has to match the address you allow in Cloudflare Access.</p>`;
  }
  html += `</section>`;

  html += `<section><h2>Draft</h2>`;
  if (draft) {
    const names = {};
    teams.forEach((t) => (names[t.id] = t.name));
    const order = JSON.parse(draft.team_order || "[]");
    html += `<dl class="kv">
      <dt>Status</dt><dd>${esc(draft.status)}</dd>
      <dt>Starts</dt><dd>${esc(fmtDate(draft.scheduled_at))}</dd>
      <dt>Rounds</dt><dd>${draft.rounds} · snake</dd>
      <dt>Per pick</dt><dd>${draft.pick_seconds}s</dd>
    </dl>`;
    if (order.length) {
      html += `<h2 style="margin-top:4px">Round 1 order</h2><ul class="order">` +
        order.map((id, i) => `<li><span>${i + 1}</span>${esc(names[id] || "?")}</li>`).join("") +
        `</ul>`;
    }
  } else {
    html += `<p class="empty">No draft scheduled.</p>`;
  }
  if (boss && !drafting) {
    html += `
      <form id="schedDraft" style="margin-top:14px">
        <input name="scheduled_at" type="datetime-local">
        <select name="pick_seconds">
          <option value="60">60s per pick</option>
          <option value="90" selected>90s per pick</option>
          <option value="120">2m per pick</option>
          <option value="300">5m per pick</option>
        </select>
        <button type="submit" class="ghost">${draft ? "Reschedule" : "Schedule draft"}</button>
      </form>
      <p class="note" style="margin-top:8px">Order is randomised each time you schedule.</p>`;
  }
  html += `</section>`;

  $("#app").innerHTML = html;
  wire();
}

function wire() {
  const addTeam = $("#addTeam");
  if (addTeam) addTeam.onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(addTeam);
    await guard(() => api("POST", "/api/teams", {
      name: f.get("name"),
      manager_email: f.get("manager_email") || undefined,
    }));
  };

  const sched = $("#schedDraft");
  if (sched) sched.onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(sched);
    const when = f.get("scheduled_at");
    await guard(() => api("POST", "/api/draft", {
      scheduled_at: when ? new Date(when).toISOString() : null,
      pick_seconds: Number(f.get("pick_seconds")),
    }));
  };

  document.querySelectorAll("[data-remove]").forEach((b) => {
    b.onclick = () => guard(() => api("DELETE", "/api/teams?id=" + b.dataset.remove));
  });
}

async function guard(fn) {
  try {
    await fn();
    await load();
  } catch (err) {
    const box = document.createElement("div");
    box.className = "alert";
    box.textContent = err.message;
    $("#app").prepend(box);
  }
}

load().catch((err) => {
  $("#app").innerHTML =
    `<section><div class="alert">${esc(err.message)}<br><br>If this mentions the database, the D1 binding or the schema may not be set up yet.</div></section>`;
});
</script>
</body>
</html>
